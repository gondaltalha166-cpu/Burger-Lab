<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Burger Lab</title>
    <link rel="icon" type="image/png" href="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=100">
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=180">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px 20px;
            margin: 0;
        }
        h1 {
            font-size: 80px;
            color: #ff9800;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        p {
            color: #bbb;
            font-size: 16px;
            max-width: 500px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #ff9800;
            color: #000;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #e68900;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back to the best burgers in Karachi!</p>
    <a href="index.html" class="btn">Back to Home</a>
</body>
</html>
